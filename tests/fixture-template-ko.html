<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 제목</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #16181d;
    --muted: #6b7280;
    --accent: #2f5bea;
    --soft: #eef2fd;
    --line: #e5e7eb;
  }
  body { margin: 0; background: #e9e9ec; }

  .slide {
    width: 1920px; height: 1080px;
    padding: 110px 140px;
    box-sizing: border-box;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    background: #fff;
    color: var(--ink);
    font: 400 40px/1.45 "Pretendard", -apple-system, sans-serif;
    word-break: keep-all; overflow-wrap: break-word;
    display: flex; flex-direction: column; gap: 40px;
  }
  .slide h1 { font-size: 96px; line-height: 1.15; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .slide h2 { font-size: 64px; line-height: 1.2; font-weight: 750; margin: 0; letter-spacing: -0.015em; }
  .slide h3 { font-size: 44px; font-weight: 700; margin: 0; }
  .slide p { margin: 0; }
  .slide ul, .slide ol { margin: 0; padding-left: 1.1em; }
  .slide li + li { margin-top: 18px; }
  .slide blockquote { margin: 0; padding-left: 32px; border-left: 6px solid var(--line); color: var(--muted); }
  .slide code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: var(--soft); padding: 0.08em 0.3em; border-radius: 6px; }
  .slide pre { margin: 0; padding: 24px 32px; background: var(--soft); border-radius: 12px; font-size: 30px; line-height: 1.5; white-space: pre-wrap; }
  .slide pre code { background: none; padding: 0; font-size: inherit; }
  .slide a { color: var(--accent); }
  .slide .muted { color: var(--muted); }
  .slide .hl { color: var(--accent); }

  .slide.title { justify-content: center; background: var(--soft); }
  .slide.title .sub { font-size: 44px; color: var(--muted); }
  .slide.title .meta { font-size: 32px; color: var(--muted); margin-top: 40px; }

  .slide .cols { display: flex; gap: 80px; flex: 1; min-height: 0; }
  .slide .cols > * { flex: 1; min-width: 0; }
  .slide .cols > div > * + * { margin-top: 24px; }
  .slide figure { margin: 0; display: flex; flex-direction: column; gap: 16px; }
  .slide figure img, .slide figure svg { width: 100%; height: auto; }
  .slide figcaption { font-size: 28px; color: var(--muted); }

  .slide table { border-collapse: collapse; font-size: 34px; }
  .slide th, .slide td { padding: 14px 28px; border-bottom: 2px solid var(--line); text-align: left; }
  .slide th { color: var(--muted); font-weight: 600; }

  .slide div.shape[data-shape] { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 20px; box-sizing: border-box; }
  .slide div.shape[data-shape] > * { margin: 0; }

  .slide .math.display { font-size: 52px; text-align: center; }
  .slide .pageno { position: absolute; right: 60px; bottom: 40px; font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<main class="deck" data-size="1920x1080">

  <!-- 1. 표지 -->
  <section class="slide title">
    <h1>발표 제목</h1>
    <p class="sub">한 줄 부제</p>
    <p class="meta">이름 · 소속 · 날짜</p>
  </section>

  <!-- 2. 요점 -->
  <section class="slide">
    <h2>슬라이드 제목</h2>
    <ul>
      <li>첫 번째 요점</li>
      <li>두 번째 요점</li>
      <li>세 번째 요점</li>
    </ul>
    <aside class="notes">발표자 메모 (화면에는 보이지 않음)</aside>
  </section>

  <!-- 3. 두 단 (글 + 그림) -->
  <section class="slide">
    <h2>텍스트와 그림</h2>
    <div class="cols">
      <div>
        <p>왼쪽에 설명을 둡니다.</p>
      </div>
      <figure>
        <svg viewBox="0 0 400 240" role="img" aria-label="예시 그래프">
          <rect x="40" y="140" width="60" height="80" fill="#c7d2fe"/>
          <rect x="140" y="90" width="60" height="130" fill="#93a5f5"/>
          <rect x="240" y="40" width="60" height="180" fill="#2f5bea"/>
          <line x1="20" y1="220" x2="380" y2="220" stroke="#9ca3af" stroke-width="2"/>
        </svg>
        <figcaption>그림 설명</figcaption>
      </figure>
    </div>
  </section>

  <!-- 4. TeX 예시 -->
  <section class="slide">
    <h2>수식</h2>
    <p>인라인 수식 <span class="math">\mathcal{L}(\theta)</span> 은 이렇게 씁니다.</p>
    <div class="math display">\mathcal{L}(\theta) = \mathbb{E}_{x \sim p}\left[-\log q_\theta(x)\right]</div>
  </section>

</main>
<script src="deck-edit.js"></script>
</body>
</html>
